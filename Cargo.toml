[package]
name = "winsploit"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "Native-Windows security toolbox: a TUI launcher that detects, installs (via Scoop) and runs pentest tools."
license = "MIT"
repository = "https://github.com/tahabenissa/nasrya-toolbox"
readme = "README.md"
build = "build.rs"
keywords = ["security", "pentest", "windows", "tui", "scoop"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
getrandom = "0.2"
# HTTPS for LAN mode: std-thread rustls with the ring backend (no async
# runtime, no cmake/nasm), a self-signed certificate made by rcgen
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
time = "0.3"

[build-dependencies]
# the app icon (build.rs); uses rc.exe on MSVC, windres on GNU
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
