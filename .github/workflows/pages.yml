name: Website

# Builds site/ (Nuxt, static) and deploys it to GitHub Pages. The site reads
# tools.yaml and src/web/ at build time, so changes there redeploy it too.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools.yaml"
      - "src/registry.rs"
      - "src/hashid.rs"
      - "src/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # the build and the link check must agree on the Pages base path
    env:
      NUXT_APP_BASE_URL: /winsploit/
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run generate

      - name: Check internal links
        run: npm run check-links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
