name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build & publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '${{ github.event.inputs.tag }}' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $stage = "dist/winsploit"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/winsploit.exe $stage/
          Copy-Item tools.yaml $stage/
          Copy-Item README.md  $stage/
          Copy-Item LICENSE    $stage/
          $zip = "dist/winsploit-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: winsploit ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
          body: |
            Prebuilt Windows x64 binary of **winsploit** — native-Windows security toolbox & command runner.

            **Install:** unzip anywhere, then run `winsploit.exe` (keep `tools.yaml` next to it).
            To use it as a `winsploit` command, add the unzipped folder to your PATH.

            > Authorized use only. The binary is unsigned — on machines with Smart App Control
            > enabled you may need to allow it, or disable SAC.
