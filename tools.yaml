# winsploit — tool registry
# Add a tool by adding an entry here; no code changes needed.
#
# Fields:
#   name        display name
#   categories  every category the tool is useful in, primary first:
#               [web, recon]. It is listed under each one. Known ids, in
#               dashboard order: osint recon network web exploit passwords
#               reversing pwn mobile forensics crypto stego wordlists
#               (others work too and are listed last). `category: web` is
#               still accepted for a single one.
#   description one line shown in the output pane header
#   exe         the executable used to DETECT installation (looked up on PATH; .exe/.com/.bat/.cmd)
#   install     (optional) scoop (default) | pipx
#   scoop       scoop package name                       (install: scoop)
#   bucket      (optional) scoop bucket the package lives in; main-bucket tools omit this.
#               If the bucket isn't added yet, winsploit adds it before installing.
#   pipx        pipx package spec: `arjun`, `pkg==1.2`, or `git+https://github.com/o/r`
#               (install: pipx). winsploit bootstraps Python + pipx through Scoop if needed.
#   run_cmd     the command actually launched (may be empty for a URL-only web tool)
#   args_hint   arguments prefilled when you press Enter (edit before running)
#   launch      (optional) stream (default: output in the pane) | gui (desktop app,
#               started detached) | web (start run_cmd if any, then open `url`) |
#               dataset (data such as wordlists: no run_cmd; Enter lists the files and
#               copies the folder path)
#   url         http(s) URL opened by launch: web
#   note        (optional) caveat shown every time the tool is run
#   verify      (optional) { args: "-version", contains: "text" }: run exe with args at
#               detection time (3 s timeout); if the output lacks the text, the exe on
#               PATH is a different program with the same name -> shown as a conflict
#   recipes     (optional) named argument presets; Enter offers them before the args prompt:
#               recipes: [{ name: quick, args: '-sV -T4 {target}' }]. Placeholders, filled
#               from the active challenge (C), written UNQUOTED (values are quoted for you):
#               {target} IP/host/URL/nc  {file} a challenge file  {out} the challenge's out\
#               folder  {wordlist} the default wordlist. Missing values are asked for.
#   options     (optional) flags and subcommands the web view's command helper suggests
#               and explains: options: [{ flag: -p, arg: '<ports>', help: ports to scan }].
#               `flag` is one word (a subcommand like `dir` works too); `arg` only for
#               flags that take a value. Quote values that start with - or <.
#   sandbox     (optional) never (default) | optional | recommended: `S` runs the tool in
#               Windows Sandbox (throwaway VM; sample read-only, network off by default).
#               Scoop gui/stream tools only. Use recommended for tools that execute the
#               sample (debuggers).
#   sandbox_deps (optional) Scoop packages mapped read-only into the sandbox and put on
#               PATH, e.g. [temurin25-jdk] for Java tools
#
# {scoop_app} in exe / run_cmd / url expands to the tool's Scoop app directory
# (<scoop root>\apps\<scoop>\current). Use it for files Scoop doesn't put on
# PATH, e.g. exe: '{scoop_app}\dnSpy.exe'. `exe` may be any file that proves the
# install, and a web tool's url may be a local '{scoop_app}\page.html'.
# {app:NAME} expands to another Scoop app's directory, in exe / run_cmd / url /
# args_hint, e.g. args_hint: '-w "{app:seclists-lite}\common.txt"'.
# Write Windows paths in 'single quotes': inside "double quotes" YAML treats \r,
# \x, \c ... as escape sequences.
#
# buckets: maps a bucket name to its git URL. Only needed for buckets Scoop
# doesn't know by name (extras, versions, java, ... need no entry).
#
# NOTE ON WIRELESS: live Wi-Fi capture / monitor-mode / injection do NOT work on
# Windows with normal adapters. Tools like aircrack-ng are offline-only here.
# Real wireless attacks need Linux + a supported USB adapter. Kept out of the
# catalog on purpose so it stays honest about what actually works.

buckets:
  security: https://github.com/opsqw/scoop-security   # formerly whoopscs/scoop-security
  # winsploit's own manifests (bucket/ in this repo) for tools no other bucket packages
  winsploit: https://github.com/tahabenissa/winsploit

# packs: curated tool sets that aren't a category. The installer offers them
# next to the category packs (`ctf` is the "CTF starter"). Names must exist below.
packs:
  ctf: [nmap, ffuf, gobuster, sqlmap, hashcat, john, hashid, openssl, exiftool, strings, steghide, cyberchef, radare2, ghidra, pwntools, rsactftool]

tools:
  - name: nmap
    categories: [network, recon]
    description: Network / port & service scanner
    exe: nmap
    scoop: nmap
    run_cmd: nmap
    args_hint: "-sV -T4 scanme.nmap.org"
    recipes:
      - { name: quick, args: '-sV -T4 {target}' }
      - { name: full, args: '-p- -sV -sC -T4 {target} -oN {out}\nmap-full.txt' }
      - { name: udp, args: '-sU --top-ports 100 {target}' }
      - { name: vuln scripts, args: '--script vuln {target}' }
    options:
      - { flag: '-sV', help: 'probe open ports for service and version' }
      - { flag: '-sC', help: 'run the default NSE scripts' }
      - { flag: '-A', help: 'aggressive: OS, versions, scripts and traceroute' }
      - { flag: '-p', arg: '<ports>', help: 'ports to scan: 22,80,443 or 1-1000' }
      - { flag: '-p-', help: 'all 65535 TCP ports' }
      - { flag: '--top-ports', arg: '<n>', help: 'the n most common ports' }
      - { flag: '-T4', help: 'faster timing (T0 slowest ... T5 fastest)' }
      - { flag: '-Pn', help: 'skip host discovery: treat the host as up' }
      - { flag: '-sn', help: 'ping sweep only, no port scan' }
      - { flag: '-sS', help: 'SYN scan (needs admin and Npcap)' }
      - { flag: '-sT', help: 'TCP connect scan (no admin needed)' }
      - { flag: '-sU', help: 'UDP scan (slow, needs admin)' }
      - { flag: '-O', help: 'guess the operating system' }
      - { flag: '-n', help: 'no DNS resolution' }
      - { flag: '--open', help: 'only show open ports' }
      - { flag: '--script', arg: '<name>', help: 'NSE scripts: vuln, http-*, smb-enum-shares ...' }
      - { flag: '--min-rate', arg: '<n>', help: 'send at least n packets per second' }
      - { flag: '-oN', arg: '<file>', help: 'save normal output' }
      - { flag: '-oA', arg: '<basename>', help: 'save every output format' }
      - { flag: '-v', help: 'verbose' }

  - name: sqlmap
    categories: [web, exploit]
    description: Automatic SQL injection tool
    exe: sqlmap
    scoop: sqlmap
    run_cmd: sqlmap
    args_hint: "--version"
    recipes:
      - { name: test the url, args: '-u {target} --batch' }
      - { name: list databases, args: '-u {target} --batch --dbs' }
      - { name: crawl forms, args: '-u {target} --batch --forms --crawl=2' }
    options:
      - { flag: '-u', arg: '<url>', help: 'target URL with the parameter, e.g. ?id=1' }
      - { flag: '--batch', help: 'never ask, use the defaults' }
      - { flag: '--dbs', help: 'list databases' }
      - { flag: '-D', arg: '<db>', help: 'database to use' }
      - { flag: '--tables', help: 'list tables' }
      - { flag: '-T', arg: '<table>', help: 'table to use' }
      - { flag: '--columns', help: 'list columns' }
      - { flag: '--dump', help: 'dump the table entries' }
      - { flag: '-p', arg: '<param>', help: 'parameter(s) to test' }
      - { flag: '--data', arg: '<body>', help: 'POST body, e.g. user=a&pass=b' }
      - { flag: '--cookie', arg: '<cookie>', help: 'Cookie header value' }
      - { flag: '-r', arg: '<file>', help: 'load the HTTP request from a file (Burp/ZAP)' }
      - { flag: '--forms', help: 'find and test forms on the page' }
      - { flag: '--crawl', arg: '<depth>', help: 'crawl the site from the URL' }
      - { flag: '--level', arg: '<1-5>', help: 'how many tests to run (default 1)' }
      - { flag: '--risk', arg: '<1-3>', help: 'how risky the tests may be (default 1)' }
      - { flag: '--technique', arg: '<BEUSTQ>', help: 'injection techniques to use' }
      - { flag: '--random-agent', help: 'random User-Agent' }
      - { flag: '--threads', arg: '<n>', help: 'concurrent requests' }
      - { flag: '--os-shell', help: 'try to get an OS shell' }

  - name: hashcat
    categories: [passwords, crypto]
    description: GPU password / hash cracker (needs GPU drivers)
    exe: hashcat
    scoop: hashcat
    run_cmd: hashcat
    args_hint: "--version"
    recipes:
      - { name: wordlist (auto mode), args: '-a 0 {file} "{app:seclists-lite}\xato-net-10-million-passwords-10000.txt"' }
      - { name: identify the hash type, args: '--identify {file}' }
      - { name: show cracked, args: '--show {file}' }
    options:
      - { flag: '-m', arg: '<mode>', help: 'hash type: 0 MD5, 100 SHA1, 1000 NTLM, 1800 sha512crypt ...' }
      - { flag: '-a', arg: '<mode>', help: 'attack: 0 wordlist, 3 mask, 6/7 hybrid' }
      - { flag: '-r', arg: '<rules>', help: 'rules file, e.g. best64.rule' }
      - { flag: '--identify', help: 'guess the hash mode' }
      - { flag: '--show', help: 'show cracked hashes from the potfile' }
      - { flag: '-o', arg: '<file>', help: 'write cracked hashes to a file' }
      - { flag: '-O', help: 'optimized kernels (faster, shorter passwords)' }
      - { flag: '-w', arg: '<1-4>', help: 'workload profile (3 high, 4 nightmare)' }
      - { flag: '--increment', help: 'grow mask length step by step' }
      - { flag: '--username', help: 'ignore user:hash usernames' }
      - { flag: '--force', help: 'ignore warnings' }
      - { flag: '--potfile-disable', help: 'don''t read or write the potfile' }
      - { flag: '-I', help: 'list the compute devices' }

  - name: tshark
    categories: [network, forensics]
    description: Wireshark CLI — packet capture / analysis (needs Npcap + admin)
    exe: tshark
    scoop: wireshark
    run_cmd: tshark
    args_hint: "-D"
    options:
      - { flag: '-D', help: 'list capture interfaces' }
      - { flag: '-i', arg: '<iface>', help: 'capture on this interface (number or name)' }
      - { flag: '-r', arg: '<file>', help: 'read a pcap / pcapng' }
      - { flag: '-w', arg: '<file>', help: 'write the capture to a file' }
      - { flag: '-f', arg: '<filter>', help: 'capture filter (BPF), e.g. "port 80"' }
      - { flag: '-Y', arg: '<filter>', help: 'display filter, e.g. http.request' }
      - { flag: '-c', arg: '<n>', help: 'stop after n packets' }
      - { flag: '-T', arg: '<format>', help: 'output format: fields, json, text ...' }
      - { flag: '-e', arg: '<field>', help: 'field to print with -T fields, e.g. ip.src' }
      - { flag: '-V', help: 'full packet details' }
      - { flag: '-q', help: 'quiet (with -z)' }
      - { flag: '-z', arg: '<stat>', help: 'statistics: io,phs  conv,tcp  http,tree ...' }
      - { flag: '--export-objects', arg: '<proto,dir>', help: 'save transferred files: http,out' }
      - { flag: '-n', help: 'no name resolution' }

  - name: nuclei
    categories: [web, recon, exploit]
    description: Template-based vulnerability scanner
    exe: nuclei
    scoop: nuclei
    run_cmd: nuclei
    args_hint: "-version"
    bucket: security
    recipes:
      - { name: scan, args: '-u {target}' }
      - { name: medium and up, args: '-u {target} -severity medium,high,critical' }
    options:
      - { flag: '-u', arg: '<url>', help: 'target' }
      - { flag: '-l', arg: '<file>', help: 'list of targets' }
      - { flag: '-t', arg: '<templates>', help: 'templates or folders to run' }
      - { flag: '-tags', arg: '<tags>', help: 'only templates with these tags, e.g. cve,lfi' }
      - { flag: '-severity', arg: '<levels>', help: 'info,low,medium,high,critical' }
      - { flag: '-as', help: 'automatic scan: pick templates from detected tech' }
      - { flag: '-rl', arg: '<n>', help: 'max requests per second' }
      - { flag: '-c', arg: '<n>', help: 'templates run in parallel' }
      - { flag: '-o', arg: '<file>', help: 'write findings to a file' }
      - { flag: '-jsonl', help: 'JSON lines output' }
      - { flag: '-silent', help: 'only show findings' }
      - { flag: '-nc', help: 'no colors' }
      - { flag: '-ut', help: 'update the templates' }

  - name: ffuf
    categories: [web, recon]
    description: Fast web fuzzer
    exe: ffuf
    scoop: ffuf
    run_cmd: ffuf
    args_hint: '-u https://example.com/FUZZ -w "{app:seclists-lite}\common.txt"'
    bucket: security
    recipes:
      - { name: dirs, args: '-u {target}/FUZZ -w {wordlist}' }
      - { name: dirs + extensions, args: '-u {target}/FUZZ -w {wordlist} -e .php,.txt,.bak' }
      - { name: recursive, args: '-u {target}/FUZZ -w {wordlist} -recursion -recursion-depth 2' }
    options:
      - { flag: '-u', arg: '<url>', help: 'URL with FUZZ where the words go' }
      - { flag: '-w', arg: '<wordlist>', help: 'wordlist (path[:KEYWORD])' }
      - { flag: '-e', arg: '<.php,.txt>', help: 'extensions to append' }
      - { flag: '-mc', arg: '<codes>', help: 'match status codes (default 200-299,301,302,307,401,403,405,500)' }
      - { flag: '-fc', arg: '<codes>', help: 'filter out status codes' }
      - { flag: '-fs', arg: '<size>', help: 'filter out response sizes' }
      - { flag: '-fw', arg: '<n>', help: 'filter out word counts' }
      - { flag: '-ac', help: 'auto-calibrate the filters' }
      - { flag: '-recursion', help: 'fuzz found folders too' }
      - { flag: '-recursion-depth', arg: '<n>', help: 'how deep to recurse' }
      - { flag: '-t', arg: '<n>', help: 'threads (default 40)' }
      - { flag: '-rate', arg: '<n>', help: 'requests per second' }
      - { flag: '-H', arg: '<"Name: value">', help: 'add a header' }
      - { flag: '-X', arg: '<method>', help: 'HTTP method' }
      - { flag: '-d', arg: '<data>', help: 'POST data' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }
      - { flag: '-c', help: 'colorize output' }

  - name: gobuster
    categories: [recon, web]
    description: Directory / DNS / vhost brute-forcer
    exe: gobuster
    scoop: gobuster
    run_cmd: gobuster
    args_hint: 'dir -u https://example.com -w "{app:seclists-lite}\common.txt"'
    recipes:
      - { name: dirs, args: 'dir -u {target} -w {wordlist}' }
      - { name: dirs + extensions, args: 'dir -u {target} -w {wordlist} -x php,txt,bak' }
    options:
      - { flag: 'dir', help: 'mode: directories and files' }
      - { flag: 'dns', help: 'mode: subdomains' }
      - { flag: 'vhost', help: 'mode: virtual hosts' }
      - { flag: 'fuzz', help: 'mode: replace FUZZ in the URL' }
      - { flag: '-u', arg: '<url>', help: 'target URL' }
      - { flag: '-w', arg: '<wordlist>', help: 'wordlist' }
      - { flag: '-x', arg: '<php,txt>', help: 'extensions to try (dir)' }
      - { flag: '-d', arg: '<domain>', help: 'domain (dns)' }
      - { flag: '-t', arg: '<n>', help: 'threads (default 10)' }
      - { flag: '-s', arg: '<codes>', help: 'status codes to show (dir)' }
      - { flag: '-b', arg: '<codes>', help: 'status codes to hide (dir)' }
      - { flag: '-k', help: 'skip TLS certificate checks' }
      - { flag: '-r', help: 'follow redirects' }
      - { flag: '--append-domain', help: 'append the domain to each word (vhost)' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }
      - { flag: '-q', help: 'quiet: no banner' }

  - name: feroxbuster
    categories: [web, recon]
    description: Fast recursive content discovery
    exe: feroxbuster
    scoop: feroxbuster
    run_cmd: feroxbuster
    args_hint: '-u https://example.com -w "{app:seclists-lite}\raft-medium-directories.txt"'
    recipes:
      - { name: dirs, args: '-u {target} -w {wordlist}' }
      - { name: depth 2 + extensions, args: '-u {target} -w {wordlist} -x php,txt -d 2' }
    options:
      - { flag: '-u', arg: '<url>', help: 'target URL' }
      - { flag: '-w', arg: '<wordlist>', help: 'wordlist' }
      - { flag: '-x', arg: '<php,txt>', help: 'extensions to try' }
      - { flag: '-d', arg: '<depth>', help: 'recursion depth (default 4)' }
      - { flag: '-n', help: 'no recursion' }
      - { flag: '-t', arg: '<n>', help: 'threads (default 50)' }
      - { flag: '-s', arg: '<codes>', help: 'status codes to show' }
      - { flag: '-C', arg: '<codes>', help: 'status codes to hide' }
      - { flag: '-S', arg: '<size>', help: 'hide responses of this size' }
      - { flag: '-e', help: 'extract links from responses' }
      - { flag: '-k', help: 'skip TLS certificate checks' }
      - { flag: '-H', arg: '<"Name: value">', help: 'add a header' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }
      - { flag: '-q', help: 'quiet: only results' }

  - name: httpx
    categories: [recon, web]
    description: ProjectDiscovery HTTP prober (not the Python httpx CLI)
    exe: httpx
    scoop: httpx
    run_cmd: httpx
    args_hint: "-u https://example.com -title -status-code"
    bucket: security
    # Python's httpx package ships an 'httpx' CLI too; make sure we found PD's
    verify: { args: "-version", contains: "projectdiscovery" }
    options:
      - { flag: '-u', arg: '<target>', help: 'host or URL to probe' }
      - { flag: '-l', arg: '<file>', help: 'list of hosts' }
      - { flag: '-sc', help: 'show the status code' }
      - { flag: '-title', help: 'show the page title' }
      - { flag: '-td', help: 'detect technologies' }
      - { flag: '-cl', help: 'show the content length' }
      - { flag: '-ip', help: 'show the IP' }
      - { flag: '-fr', help: 'follow redirects' }
      - { flag: '-p', arg: '<ports>', help: 'ports to probe' }
      - { flag: '-mc', arg: '<codes>', help: 'only show these status codes' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }
      - { flag: '-j', help: 'JSON lines output' }
      - { flag: '-silent', help: 'only results' }

  - name: subfinder
    categories: [recon, osint]
    description: Passive subdomain enumeration
    exe: subfinder
    scoop: subfinder
    run_cmd: subfinder
    args_hint: "-d example.com"
    bucket: security
    options:
      - { flag: '-d', arg: '<domain>', help: 'domain to enumerate' }
      - { flag: '-dL', arg: '<file>', help: 'list of domains' }
      - { flag: '-all', help: 'use every source (slower)' }
      - { flag: '-recursive', help: 'only sources that can recurse' }
      - { flag: '-t', arg: '<n>', help: 'threads' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }
      - { flag: '-oJ', help: 'JSON lines output' }
      - { flag: '-silent', help: 'only subdomains' }

  - name: amass
    categories: [recon, osint]
    description: In-depth attack-surface / subdomain mapping
    exe: amass
    scoop: amass
    run_cmd: amass
    args_hint: "enum -passive -d example.com"
    options:
      - { flag: 'enum', help: 'subcommand: find subdomains' }
      - { flag: 'intel', help: 'subcommand: find root domains and ASNs' }
      - { flag: '-d', arg: '<domain>', help: 'domain' }
      - { flag: '-passive', help: 'passive sources only (no DNS brute force)' }
      - { flag: '-active', help: 'active: zone transfers, cert grabs' }
      - { flag: '-brute', help: 'DNS brute force' }
      - { flag: '-w', arg: '<wordlist>', help: 'wordlist for -brute' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }

  - name: katana
    categories: [web, recon]
    description: Next-gen web crawler / spider
    exe: katana
    scoop: katana
    run_cmd: katana
    args_hint: "-u https://example.com"
    bucket: security
    recipes:
      - { name: crawl, args: '-u {target} -d 3' }
    options:
      - { flag: '-u', arg: '<url>', help: 'start URL' }
      - { flag: '-list', arg: '<file>', help: 'list of URLs' }
      - { flag: '-d', arg: '<depth>', help: 'crawl depth (default 3)' }
      - { flag: '-jc', help: 'parse JavaScript for endpoints' }
      - { flag: '-kf', arg: '<all>', help: 'known files: robots.txt, sitemap.xml' }
      - { flag: '-headless', help: 'crawl with a headless browser' }
      - { flag: '-ef', arg: '<exts>', help: 'skip these extensions, e.g. png,css' }
      - { flag: '-f', arg: '<field>', help: 'print only a field: url, path, qurl ...' }
      - { flag: '-c', arg: '<n>', help: 'concurrent fetchers' }
      - { flag: '-o', arg: '<file>', help: 'write results to a file' }
      - { flag: '-jsonl', help: 'JSON lines output' }
      - { flag: '-silent', help: 'only results' }

  - name: rustscan
    categories: [network, recon]
    description: Ultra-fast port scanner that feeds nmap
    exe: rustscan
    scoop: rustscan
    run_cmd: rustscan
    args_hint: "-a 127.0.0.1 -- -sV"
    recipes:
      - { name: quick, args: '-a {target} -- -sV' }
      - { name: all ports, args: '-a {target} -r 1-65535 -- -sV -sC' }
    options:
      - { flag: '-a', arg: '<hosts>', help: 'addresses, CIDRs or hostnames' }
      - { flag: '-p', arg: '<ports>', help: 'ports: 22,80,443' }
      - { flag: '-r', arg: '<range>', help: 'port range: 1-65535' }
      - { flag: '--top', help: 'the top 1000 ports' }
      - { flag: '-b', arg: '<n>', help: 'batch size (ports at once)' }
      - { flag: '-t', arg: '<ms>', help: 'timeout per port' }
      - { flag: '-g', help: 'greppable: only host -> ports, no nmap' }
      - { flag: '--', help: 'everything after this goes to nmap, e.g. -- -sV -sC' }

  - name: openssl
    categories: [crypto, network]
    description: General-purpose cryptography toolkit
    exe: openssl
    scoop: openssl
    run_cmd: openssl
    args_hint: "version -a"
    options:
      - { flag: 'version', help: 'subcommand: show the version (-a for details)' }
      - { flag: 's_client', help: 'subcommand: connect to a TLS server' }
      - { flag: 'x509', help: 'subcommand: read certificates' }
      - { flag: 'req', help: 'subcommand: certificate requests' }
      - { flag: 'genrsa', help: 'subcommand: make an RSA key' }
      - { flag: 'rsa', help: 'subcommand: read or convert RSA keys' }
      - { flag: 'pkey', help: 'subcommand: read any private / public key' }
      - { flag: 'enc', help: 'subcommand: symmetric encrypt / decrypt' }
      - { flag: 'dgst', help: 'subcommand: hash or sign a file' }
      - { flag: 'base64', help: 'subcommand: base64 encode (-d decode)' }
      - { flag: 'asn1parse', help: 'subcommand: dump ASN.1 structure' }
      - { flag: '-connect', arg: '<host:port>', help: 's_client: where to connect' }
      - { flag: '-servername', arg: '<name>', help: 's_client: SNI host name' }
      - { flag: '-showcerts', help: 's_client: print the whole chain' }
      - { flag: '-in', arg: '<file>', help: 'input file' }
      - { flag: '-out', arg: '<file>', help: 'output file' }
      - { flag: '-text', help: 'print in human-readable form' }
      - { flag: '-noout', help: 'don''t print the encoded form' }
      - { flag: '-pubin', help: 'the input is a public key' }
      - { flag: '-d', help: 'decrypt / decode' }

  - name: exiftool
    categories: [forensics, osint, stego]
    description: Read / write file metadata
    exe: exiftool
    scoop: exiftool
    run_cmd: exiftool
