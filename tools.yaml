    exe: john
    scoop: john-jumbo
    bucket: winsploit
    run_cmd: john
    args_hint: '--wordlist="{app:seclists-lite}\xato-net-10-million-passwords-10000.txt" hashes.txt'
    note: official Openwall Windows build (1.9.0-jumbo-1, 2019); zip2john, rar2john, keepass2john etc. are on PATH too
    recipes:
      - { name: wordlist, args: '--wordlist="{app:seclists-lite}\xato-net-10-million-passwords-10000.txt" {file}' }
      - { name: single crack, args: '--single {file}' }
      - { name: show cracked, args: '--show {file}' }
    options:
      - { flag: '--wordlist=', arg: '<file>', help: 'wordlist mode' }
      - { flag: '--rules', help: 'mangle the wordlist words (--rules=<set>)' }
      - { flag: '--format=', arg: '<name>', help: 'hash format: raw-md5, nt, bcrypt ...' }
      - { flag: '--single', help: 'single crack mode (from user names)' }
      - { flag: '--incremental', help: 'brute force' }
      - { flag: '--show', help: 'show cracked passwords' }
      - { flag: '--list=formats', help: 'list the supported formats' }
      - { flag: '--fork=', arg: '<n>', help: 'processes' }
      - { flag: '--session=', arg: '<name>', help: 'name this session' }
      - { flag: '--restore', help: 'continue the last session' }
      - { flag: '--pot=', arg: '<file>', help: 'use this pot file' }

  - name: steghide
    categories: [stego, forensics]
    description: Hide / extract data in images and audio
    exe: steghide
    scoop: steghide
    bucket: winsploit
    run_cmd: steghide
    args_hint: "info image.jpg"
    note: legacy 2003 Win32 build - still the reference steghide; extract with -sf image.jpg -p <passphrase>
    recipes:
      - { name: info, args: 'info {file}' }
      - { name: extract, empty passphrase, args: 'extract -sf {file} -p "" -xf {out}\steghide.out' }
    options:
      - { flag: 'info', help: 'subcommand: what is embedded' }
      - { flag: 'extract', help: 'subcommand: extract hidden data' }
      - { flag: 'embed', help: 'subcommand: hide a file' }
      - { flag: '-sf', arg: '<file>', help: 'stego file (extract)' }
      - { flag: '-cf', arg: '<file>', help: 'cover file (embed)' }
      - { flag: '-ef', arg: '<file>', help: 'file to embed' }
      - { flag: '-xf', arg: '<file>', help: 'write extracted data here' }
      - { flag: '-p', arg: '<pass>', help: 'passphrase ("" for none)' }
      - { flag: '-f', help: 'overwrite existing files' }

  - name: nikto
    categories: [web, network]
    description: Web server vulnerability scanner
    exe: nikto
    scoop: nikto
    bucket: winsploit
    run_cmd: nikto
    args_hint: "-h https://example.com"
    recipes:
      - { name: scan, args: '-h {target}' }
    options:
      - { flag: '-h', arg: '<host>', help: 'host or URL' }
      - { flag: '-p', arg: '<port>', help: 'port(s)' }
      - { flag: '-ssl', help: 'force TLS' }
      - { flag: '-nossl', help: 'never use TLS' }
      - { flag: '-Tuning', arg: '<x>', help: 'test types: 1-9, a-c, x (exclude)' }
      - { flag: '-maxtime', arg: '<s>', help: 'stop after this many seconds' }
      - { flag: '-id', arg: '<user:pass>', help: 'HTTP basic auth' }
      - { flag: '-o', arg: '<file>', help: 'write the report' }
      - { flag: '-Format', arg: '<fmt>', help: 'htm, csv, txt, xml' }
      - { flag: '-Display', arg: '<V>', help: 'V verbose, 1-4 show redirects/cookies/...' }

  - name: seclists-lite
    categories: [wordlists, passwords, web]
    description: SecLists essentials - web, DNS, password, username and LFI wordlists
