# winsploit — tool registry
# Add a tool by adding an entry here; no code changes needed.
#
# Fields:
#   name        display name
#   category    recon | web | passwords | sniffing | forensics | ...
#   description one line shown in the output pane header
#   exe         the executable used to DETECT installation (looked up on PATH; .exe/.com/.bat/.cmd)
#   install     (optional) scoop (default) | pipx
#   scoop       scoop package name                       (install: scoop)
#   bucket      (optional) scoop bucket the package lives in; main-bucket tools omit this.
#               If the bucket isn't added yet, winsploit adds it before installing.
#   pipx        pipx package spec: `arjun`, `pkg==1.2`, or `git+https://github.com/o/r`
#               (install: pipx). winsploit bootstraps Python + pipx through Scoop if needed.
#   run_cmd     the command actually launched (may be empty for a URL-only web tool)
#   args_hint   arguments prefilled when you press Enter (edit before running)
#   launch      (optional) stream (default: output in the pane) | gui (desktop app,
#               started detached) | web (start run_cmd if any, then open `url`) |
#               dataset (data such as wordlists: no run_cmd; Enter lists the files and
#               copies the folder path)
#   url         http(s) URL opened by launch: web
#   note        (optional) caveat shown every time the tool is run
#   verify      (optional) { args: "-version", contains: "text" }: run exe with args at
#               detection time (3 s timeout); if the output lacks the text, the exe on
#               PATH is a different program with the same name -> shown as a conflict
#
# {scoop_app} in exe / run_cmd / url expands to the tool's Scoop app directory
# (<scoop root>\apps\<scoop>\current). Use it for files Scoop doesn't put on
# PATH, e.g. exe: '{scoop_app}\dnSpy.exe'. `exe` may be any file that proves the
# install, and a web tool's url may be a local '{scoop_app}\page.html'.
# {app:NAME} expands to another Scoop app's directory, in exe / run_cmd / url /
# args_hint, e.g. args_hint: '-w "{app:seclists-lite}\common.txt"'.
# Write Windows paths in 'single quotes': inside "double quotes" YAML treats \r,
# \x, \c ... as escape sequences.
#
# buckets: maps a bucket name to its git URL. Only needed for buckets Scoop
# doesn't know by name (extras, versions, java, ... need no entry).
#
# NOTE ON WIRELESS: live Wi-Fi capture / monitor-mode / injection do NOT work on
# Windows with normal adapters. Tools like aircrack-ng are offline-only here.
# Real wireless attacks need Linux + a supported USB adapter. Kept out of the
# catalog on purpose so it stays honest about what actually works.

buckets:
  security: https://github.com/opsqw/scoop-security   # formerly whoopscs/scoop-security
  # winsploit's own manifests (bucket/ in this repo) for tools no other bucket packages
  winsploit: https://github.com/tahabenissa/nasrya-toolbox

tools:
  - name: nmap
    category: recon
    description: Network / port & service scanner
    exe: nmap
    scoop: nmap
    run_cmd: nmap
    args_hint: "-sV -T4 scanme.nmap.org"

  - name: sqlmap
    category: web
    description: Automatic SQL injection tool
    exe: sqlmap
    scoop: sqlmap
    run_cmd: sqlmap
    args_hint: "--version"

  - name: hashcat
    category: passwords
    description: GPU password / hash cracker (needs GPU drivers)
    exe: hashcat
    scoop: hashcat
    run_cmd: hashcat
    args_hint: "--version"

  - name: tshark
    category: sniffing
    description: Wireshark CLI — packet capture / analysis (needs Npcap + admin)
    exe: tshark
    scoop: wireshark
    run_cmd: tshark
    args_hint: "-D"

  - name: nuclei
    category: web
    description: Template-based vulnerability scanner
    exe: nuclei
    scoop: nuclei
    run_cmd: nuclei
    args_hint: "-version"
    bucket: security

  - name: ffuf
    category: web
    description: Fast web fuzzer
    exe: ffuf
    scoop: ffuf
    run_cmd: ffuf
    args_hint: '-u https://example.com/FUZZ -w "{app:seclists-lite}\common.txt"'
    bucket: security

  - name: gobuster
    category: recon
    description: Directory / DNS / vhost brute-forcer
    exe: gobuster
    scoop: gobuster
    run_cmd: gobuster
    args_hint: 'dir -u https://example.com -w "{app:seclists-lite}\common.txt"'

  - name: feroxbuster
    category: web
    description: Fast recursive content discovery
    exe: feroxbuster
    scoop: feroxbuster
    run_cmd: feroxbuster
    args_hint: '-u https://example.com -w "{app:seclists-lite}\raft-medium-directories.txt"'

  - name: httpx
    category: recon
    description: ProjectDiscovery HTTP prober (not the Python httpx CLI)
    exe: httpx
    scoop: httpx
    run_cmd: httpx
    args_hint: "-u https://example.com -title -status-code"
    bucket: security
    # Python's httpx package ships an 'httpx' CLI too; make sure we found PD's
    verify: { args: "-version", contains: "projectdiscovery" }

  - name: subfinder
    category: recon
    description: Passive subdomain enumeration
    exe: subfinder
    scoop: subfinder
    run_cmd: subfinder
    args_hint: "-d example.com"
    bucket: security

  - name: amass
    category: recon
    description: In-depth attack-surface / subdomain mapping
    exe: amass
    scoop: amass
    run_cmd: amass
    args_hint: "enum -passive -d example.com"

  - name: katana
    category: web
    description: Next-gen web crawler / spider
    exe: katana
    scoop: katana
    run_cmd: katana
    args_hint: "-u https://example.com"
    bucket: security

  - name: rustscan
    category: recon
    description: Ultra-fast port scanner that feeds nmap
    exe: rustscan
    scoop: rustscan
    run_cmd: rustscan
    args_hint: "-a 127.0.0.1 -- -sV"

  - name: openssl
    category: crypto
    description: General-purpose cryptography toolkit
    exe: openssl
    scoop: openssl
    run_cmd: openssl
    args_hint: "version -a"

  - name: exiftool
    category: forensics
    description: Read / write file metadata
    exe: exiftool
    scoop: exiftool
    run_cmd: exiftool
    args_hint: "image.jpg"

  - name: strings
    category: forensics
    description: Sysinternals Strings - extract ASCII/Unicode text
    exe: strings
    scoop: sysinternals
    run_cmd: strings
    args_hint: "-accepteula -n 8 target.bin"
    bucket: extras

  - name: radare2
    category: reversing
    description: Reverse-engineering framework
    exe: radare2
    scoop: radare2
    run_cmd: radare2
    args_hint: "-v"

  - name: upx
    category: reversing
    description: Executable packer / unpacker
    exe: upx
    scoop: upx
    run_cmd: upx
    args_hint: "-V"

  - name: jadx
    category: reversing
    description: Android DEX to Java decompiler (needs a JDK)
    exe: jadx
    scoop: jadx
    run_cmd: jadx
    args_hint: "--version"
    bucket: extras

  - name: apktool
    category: reversing
    description: Decode / rebuild Android APK resources (needs a JRE)
    exe: apktool
    scoop: apktool
    run_cmd: apktool
    args_hint: "--version"

  - name: arjun
    category: web
    description: HTTP parameter discovery
    exe: arjun
    install: pipx
    pipx: arjun
    run_cmd: arjun
    args_hint: "-u https://example.com/endpoint"

  - name: dirsearch
    category: web
    description: Web path brute-forcer
    exe: dirsearch
    install: pipx
    pipx: dirsearch
    run_cmd: dirsearch
    args_hint: '-u https://example.com -w "{app:seclists-lite}\common.txt"'
    note: needs Python 3.11+

  - name: wfuzz
    category: web
    description: Web content / parameter fuzzer
    exe: wfuzz
    install: pipx
    pipx: wfuzz
    run_cmd: wfuzz
    args_hint: '-c -z "file,{app:seclists-lite}\common.txt" --hc 404 https://example.com/FUZZ'
    note: wfuzz depends on pycurl and was last released in 2020; if the install fails on a new Python, ffuf or feroxbuster cover the same ground

  - name: commix
    category: web
    description: Automated command-injection exploiter
    exe: commix
    install: pipx
    pipx: git+https://github.com/commixproject/commix
    run_cmd: commix
    args_hint: "--url=https://example.com/?addr=127.0.0.1 --batch"

  - name: hashid
    category: passwords
    description: Identify hash types
    exe: hashid
    install: pipx
    pipx: hashid
    run_cmd: hashid
    args_hint: "-m 5f4dcc3b5aa765d61d8327deb882cf99"

  - name: netexec
    category: passwords
    description: Network service auth / enumeration (nxc)
    exe: nxc
    install: pipx
    pipx: git+https://github.com/Pennyw0rth/NetExec
    run_cmd: nxc
    args_hint: "smb 192.168.1.0/24"
    note: needs Python 3.11+; SMB/LDAP/WinRM work on Windows, some other protocols are degraded

  - name: rsactftool
    category: crypto
    description: Attack RSA given partial key material
    exe: RsaCtfTool
    install: pipx
    pipx: git+https://github.com/RsaCtfTool/RsaCtfTool
    run_cmd: RsaCtfTool
    args_hint: "--publickey key.pub --private"
    note: gmpy2 may need a C toolchain to build on Windows if no wheel matches your Python

  - name: volatility3
    category: forensics
    description: Memory-dump forensics framework
    exe: vol
    install: pipx
    pipx: volatility3
    run_cmd: vol
    args_hint: "-f memory.dmp windows.info"

  - name: ropper
    category: pwn
    description: Find ROP gadgets in binaries
    exe: ropper
    install: pipx
    pipx: ropper
    run_cmd: ropper
    args_hint: "--file binary.exe --search \"pop rdi\""

  - name: pwntools
    category: pwn
    description: CTF exploit-development framework (pwn CLI)
    exe: pwn
    install: pipx
    pipx: pwntools
    run_cmd: pwn
    args_hint: "checksec binary.elf"
    note: Windows support is limited - remote tubes, packing, asm and checksec work; local process/gdb features need Linux or WSL

  - name: theharvester
    category: osint
    description: Email / subdomain / host OSINT gathering
    exe: theHarvester
    install: pipx
    pipx: git+https://github.com/laramies/theHarvester
    run_cmd: theHarvester
    args_hint: "-d example.com -b duckduckgo"
    note: needs Python 3.14+ (pipx uses the Python it runs on)

  - name: sherlock
    category: osint
    description: Hunt usernames across social networks
    exe: sherlock
    install: pipx
    pipx: sherlock-project
    run_cmd: sherlock
    args_hint: "username"

  - name: sleuthkit
    category: forensics
    description: Disk-image and filesystem forensics (TSK fls; also icat, mmls, ...)
    exe: fls
    scoop: sleuthkit
    run_cmd: fls
    args_hint: "-r -o 2048 image.dd"

  - name: detect-it-easy
    category: reversing
    description: Identify packers / compilers / file types (DIE console)
    exe: diec
    scoop: detect-it-easy
    bucket: extras
    run_cmd: diec
    args_hint: "binary.exe"
    note: this runs the console version (diec); the GUI is 'die', also on PATH

  - name: cutter
    category: reversing
    description: GUI for rizin (radare2 fork)
    exe: cutter
    scoop: cutter
    bucket: extras
    run_cmd: cutter
    args_hint: ""
    launch: gui

  - name: x64dbg
    category: reversing
    description: Windows x64 user-mode debugger
    exe: x64dbg
    scoop: x64dbg
    bucket: extras
    run_cmd: x64dbg
    args_hint: ""
    launch: gui
    note: for 32-bit targets run x32dbg (also installed), or x96dbg to pick automatically

  - name: dnspy
    category: reversing
    description: .NET decompiler / debugger (dnSpyEx)
    exe: '{scoop_app}\dnSpy.exe'
    scoop: dnspyex
    bucket: extras
    run_cmd: '{scoop_app}\dnSpy.exe'
    args_hint: ""
    launch: gui

  - name: ghidra
    category: reversing
    description: NSA software reverse-engineering suite
    exe: ghidraRun
    scoop: ghidra
    bucket: extras
    run_cmd: ghidraRun
    args_hint: ""
    launch: gui
    note: needs a JDK 21+ (e.g. scoop bucket add java; scoop install java/temurin25-jdk)

  - name: zaproxy
    category: web
    description: OWASP ZAP - intercepting proxy and web scanner
    exe: zap
    scoop: zaproxy
    bucket: extras
    run_cmd: zap
    args_hint: ""
    launch: gui
    note: needs a Java 17+ runtime (e.g. scoop bucket add java; scoop install java/temurin17-jre)

  - name: cyberchef
    category: crypto
    description: The Cyber Swiss-Army Knife (encode / decode / crypto), offline
    exe: '{scoop_app}\CyberChef.html'
    scoop: cyberchef
    bucket: extras
    run_cmd: ""
    launch: web
    url: '{scoop_app}\CyberChef.html'

  - name: gau
    category: recon
    description: Fetch known URLs from web archives (getallurls)
    exe: gau
    scoop: gau
    bucket: winsploit
    run_cmd: gau
    args_hint: "--subs example.com"

  - name: john
    category: passwords
    description: John the Ripper (jumbo) hash cracker
    exe: john
    scoop: john-jumbo
    bucket: winsploit
    run_cmd: john
    args_hint: '--wordlist="{app:seclists-lite}\xato-net-10-million-passwords-10000.txt" hashes.txt'
    note: official Openwall Windows build (1.9.0-jumbo-1, 2019); zip2john, rar2john, keepass2john etc. are on PATH too

  - name: steghide
    category: stego
    description: Hide / extract data in images and audio
    exe: steghide
    scoop: steghide
    bucket: winsploit
    run_cmd: steghide
    args_hint: "info image.jpg"
    note: legacy 2003 Win32 build - still the reference steghide; extract with -sf image.jpg -p <passphrase>

  - name: nikto
    category: web
    description: Web server vulnerability scanner
    exe: nikto
    scoop: nikto
    bucket: winsploit
    run_cmd: nikto
    args_hint: "-h https://example.com"

  - name: seclists-lite
    category: wordlists
    description: SecLists essentials - web, DNS, password, username and LFI wordlists
    exe: '{scoop_app}\common.txt'
    scoop: seclists-lite
    bucket: winsploit
    launch: dataset
    note: other tools' args already point at these lists; Enter shows the files and copies the folder path
